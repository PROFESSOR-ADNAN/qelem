services:
  nginx:
    image: nginx:1.26-alpine
    container_name: qelem-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api1
      - api2
    networks:
      - qelem-edge-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 200M

  api1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: qelem-prod-api1
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: api-1
    env_file:
      - ../.env.production
    depends_on:
      mongodb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - qelem-edge-net
      - qelem-internal-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M

  api2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: qelem-prod-api2
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: api-2
    env_file:
      - ../.env.production
    depends_on:
      mongodb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - qelem-edge-net
      - qelem-internal-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: qelem-prod-worker
    restart: always
    environment:
      NODE_ENV: production
    env_file:
      - ../.env.production
    depends_on:
      mongodb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - qelem-internal-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.scheduler
    container_name: qelem-prod-scheduler
    restart: always
    environment:
      NODE_ENV: production
    env_file:
      - ../.env.production
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - qelem-internal-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  mongodb:
    image: mongo:7.0
    container_name: qelem-prod-mongodb
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1.2"]
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "rs.status().ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qelem-internal-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: qelem-prod-valkey
    restart: always
    command: ["valkey-server", "--save", "900", "1", "--maxmemory", "768mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - valkey-prod-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - qelem-internal-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

volumes:
  mongo-prod-data:
  valkey-prod-data:
  nginx-logs:

networks:
  qelem-edge-net:
    driver: bridge
  qelem-internal-net:
    driver: bridge
    internal: true
