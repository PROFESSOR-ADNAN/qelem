services:
  mongodb:
    image: mongo:7.0
    container_name: qelem-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db
      - ./init-mongo-rs.sh:/docker-entrypoint-initdb.d/init-rs.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - qelem-net

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: qelem-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "900", "1", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-dev-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - qelem-net

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-07Z
    container_name: qelem-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-dev-data:/data
    networks:
      - qelem-net

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: qelem-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/qelem-dev-bucket;
      /usr/bin/mc anonymous set download local/qelem-dev-bucket/media;
      exit 0;
      "
    networks:
      - qelem-net

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: qelem-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - qelem-net

  fake-cdn-purge:
    image: caddy:2.8-alpine
    container_name: qelem-fake-cdn-purge
    restart: unless-stopped
    command: >
      caddy respond --listen :8088 --body '{"result":{"id":"fake-purge-ok"},"success":true,"errors":[],"messages":[]}'
    ports:
      - "8088:8088"
    networks:
      - qelem-net

volumes:
  mongo-dev-data:
  valkey-dev-data:
  minio-dev-data:

networks:
  qelem-net:
    driver: bridge
