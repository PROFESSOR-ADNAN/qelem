groups:
  - name: qelem-slo-alerts
    rules:
      - alert: FeedLatencyBreachP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{route="/api/v1/feed/home"}[5m])) by (le)) > 0.200
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Home feed p95 latency exceeds 200ms SLO"
          runbook: "docs/runbooks/high-feed-latency.md"

      - alert: DegradedPathSpike
        expr: sum(rate(qelem_feed_degraded_total[5m])) / sum(rate(qelem_feed_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Degraded MongoDB feed read path exceeded 5% of requests"
          runbook: "docs/runbooks/redis-down-or-wiped.md"

      - alert: CounterReconciliationDrift
        expr: qelem_counter_reconciliation_drift_total > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Counter drift detected between Redis cache and MongoDB collections"
          runbook: "docs/runbooks/counter-drift.md"

      - alert: FanoutQueueLagHigh
        expr: qelem_queue_waiting_jobs{queue="fanout"} > 500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Fanout queue backlog exceeding processing throughput"
          runbook: "docs/runbooks/fanout-backlog.md"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis memory utilization exceeds 80% of configured cap"
          runbook: "docs/runbooks/high-feed-latency.md"
