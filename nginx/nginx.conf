user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # JSON Access Logging
    log_format json_combined escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"remote_user":"$remote_user",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Rate limiting zone for IP: 100 req/s with 200 burst (generous for Ethiopian CGNAT mobile gateways)
    limit_req_zone $binary_remote_addr zone=cgnat_limit:20m rate=100r/s;

    # Include Crawler Detection Map
    include snippets/crawlers.conf;

    upstream api_cluster {
        server api1:5000;
        server api2:5000;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Healthcheck endpoint
        location /healthz {
            return 200 '{"status":"ok","proxy":"nginx"}';
            add_header Content-Type application/json;
        }

        # Block malicious attack scanners
        location ~* (/\.env|/\.git|wp-login\.php|\.php$) {
            return 404;
        }

        # Open Graph Crawler Rewrites for Social Previews
        location ~* ^/p/([a-f0-9]+)$ {
            if ($is_social_crawler = 1) {
                rewrite ^/p/(.*)$ /api/v1/share/p/$1 last;
            }
            try_files $uri /index.html;
        }

        location ~* ^/u/([a-z0-9_]+)$ {
            if ($is_social_crawler = 1) {
                rewrite ^/u/(.*)$ /api/v1/share/u/$1 last;
            }
            try_files $uri /index.html;
        }

        # Server-Sent Events (SSE) Stream
        location /api/v1/stream {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Express REST API
        location /api/ {
            limit_req zone=cgnat_limit burst=200 nodelay;
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static React PWA Frontend
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            include snippets/security-headers.conf;
        }

        # Cache static assets
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
