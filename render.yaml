services:
  # ----------------------------------------------------------------------------
  # 1. QELEM REST API & SSE WEB SERVICE
  # ----------------------------------------------------------------------------
  - type: web
    name: qelem-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=server
    startCommand: node server/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_BASE_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: qelem-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CURSOR_SIGNING_SECRET
        generateValue: true
      - key: UNSUBSCRIBE_TOKEN_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_CDN_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: mock
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # 2. QELEM BULLMQ BACKGROUND WORKER (FAN-OUT, SHARP, NOTIFICATIONS, EMAIL)
  # ----------------------------------------------------------------------------
  - type: worker
    name: qelem-worker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=worker
    startCommand: node worker/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: qelem-redis
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_CDN_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: mock
      - key: CHAPA_SECRET_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 3. QELEM VALKEY / REDIS IN-MEMORY STORE
  # ----------------------------------------------------------------------------
  - type: redis
    name: qelem-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
